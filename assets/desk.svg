<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="t">
  <title id="t">Illustration: a top-down view of a desk with a laptop, a notebook, a pen and a mug of tea</title>
  <rect width="900" height="620" fill="#efe7d8"/>

  <!-- wood grain -->
  <g stroke="#e3d8c4" stroke-width="2" opacity=".8">
    <path d="M0 84h900M0 182h900M0 286h900M0 392h900M0 500h900M0 596h900"/>
  </g>

  <!-- laptop -->
  <g>
    <rect x="150" y="120" width="430" height="286" rx="12" fill="#161c22"/>
    <rect x="172" y="142" width="386" height="236" rx="4" fill="#202a33"/>
    <!-- code on screen -->
    <g font-family="Consolas, monospace" font-size="13">
      <text x="192" y="176" fill="#e2865f">import</text>
      <text x="256" y="176" fill="#cfc9bd">agent</text>
      <text x="192" y="202" fill="#7cc39c">gateway</text>
      <text x="272" y="202" fill="#9aa4ac">=</text>
      <text x="292" y="202" fill="#cfc9bd">connect(</text>
      <text x="372" y="202" fill="#e2c08a">":3080"</text>
      <text x="440" y="202" fill="#cfc9bd">)</text>
      <text x="192" y="228" fill="#7cc39c">task</text>
      <text x="240" y="228" fill="#9aa4ac">=</text>
      <text x="260" y="228" fill="#cfc9bd">agent.run(</text>
      <text x="356" y="228" fill="#e2c08a">"deploy"</text>
      <text x="428" y="228" fill="#cfc9bd">)</text>
      <text x="192" y="254" fill="#6f7d88"># retry on timeout</text>
      <text x="192" y="286" fill="#e2865f">for</text>
      <text x="228" y="286" fill="#cfc9bd">step</text>
      <text x="272" y="286" fill="#e2865f">in</text>
      <text x="300" y="286" fill="#cfc9bd">task.steps:</text>
      <text x="214" y="312" fill="#7cc39c">print</text>
      <text x="264" y="312" fill="#cfc9bd">(step.name)</text>
      <rect x="192" y="332" width="9" height="15" fill="#b0472a">
        <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- base -->
    <rect x="126" y="406" width="478" height="16" rx="8" fill="#2b343c"/>
  </g>

  <!-- notebook -->
  <g transform="rotate(-7 700 300)">
    <rect x="646" y="150" width="176" height="246" rx="8" fill="#fffdf8" stroke="#d8cfbd"/>
    <rect x="646" y="150" width="14" height="246" rx="7" fill="#b0472a"/>
    <g stroke="#d8cfbd" stroke-width="2">
      <path d="M680 196h112M680 222h112M680 248h112M680 274h112M680 300h112M680 326h72"/>
    </g>
    <g fill="#8a99a8" font-family="Consolas, monospace" font-size="10">
      <text x="680" y="186">-- TODO / THIS WEEK --</text>
    </g>
  </g>

  <!-- pen -->
  <g transform="rotate(24 600 470)">
    <rect x="560" y="462" width="180" height="12" rx="6" fill="#33404b"/>
    <path d="M740 462l26 6-26 6v-12Z" fill="#b0472a"/>
    <rect x="560" y="462" width="26" height="12" rx="6" fill="#8794a0"/>
  </g>

  <!-- mug -->
  <g>
    <circle cx="300" cy="500" r="58" fill="#fffdf8" stroke="#d8cfbd"/>
    <circle cx="300" cy="500" r="46" fill="#7b4a32"/>
    <path d="M356 486c26 0 26 34 0 34" fill="none" stroke="#d8cfbd" stroke-width="10"/>
    <g stroke="#c9bda9" stroke-width="3" fill="none" opacity=".8">
      <path d="M286 430c8-14-8-22 0-36"/>
      <path d="M310 434c8-14-8-22 0-36"/>
    </g>
  </g>

  <!-- sticky notes -->
  <g transform="rotate(5 120 500)">
    <rect x="92" y="446" width="96" height="90" rx="3" fill="#e8c48c"/>
    <g stroke="#c9a76f" stroke-width="2">
      <path d="M108 474h62M108 492h62M108 510h40"/>
    </g>
  </g>

  <g fill="#a3927a" font-family="Consolas, monospace" font-size="10" letter-spacing="1">
    <text x="72" y="576">DESK · 2026</text>
  </g>
</svg>
